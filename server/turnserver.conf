# coturn, run next to the relay when TURN_SECRET is set (see start.sh). The
# relay hands out passwords made with the same secret; coturn checks them.
# start.sh adds the addresses, which are only known once the machine is up.

listening-port=3478
# The relay ports Fly forwards (fly.toml): one per open TURN connection.
min-port=49152
max-port=49407

use-auth-secret
realm=weave
fingerprint
no-cli
no-tls
no-dtls
# Browsers only ever ask for UDP relays; relaying TCP would let anyone tunnel.
no-tcp-relay
stale-nonce=600

# Anyone can get a password from the public relay, so cap what they can carry.
# The relay gives each address (IPv4, or IPv6 /64) one username at a time, so
# user-quota is per address. Both *-bps settings are BYTES per second, and
# coturn sets aside max-bps for every session when it opens (a browser opens
# one or two per connection, whether or not it ends up using them), refusing
# new ones once bps-capacity is spoken for. So:
#   sessions at once   = bps-capacity / max-bps           = 20
#   most it can send   = bps-capacity = 40 Mbit/s ≈ 13 TB a month flat out
#   at Fly's $0.02/GB  ≈ $260 a month, if someone kept it full all month.
# Lower bps-capacity to spend less; fewer people then get TURN at once.
user-quota=6
total-quota=20
max-bps=250000
bps-capacity=5000000

# Only to the public internet: nothing on Fly's private network or this machine.
# (coturn refuses loopback peers by default; they are listed below as well.)
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

log-file=stdout
simple-log
